<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동의대바이브날씨의 부산 날씨</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #e8f1fb;
      color: #1a2433;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 32px 20px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(1.7rem, 7vw, 2.3rem);
      line-height: 1.3;
      word-break: keep-all;
    }

    .temp {
      margin: 0;
      font-size: clamp(4.5rem, 22vw, 6.5rem);
      line-height: 1.1;
      font-weight: 800;
    }

    .desc {
      margin: 8px 0 0;
      font-size: clamp(1.6rem, 7vw, 2rem);
      font-weight: 700;
    }

    .time {
      margin: 16px 0 0;
      font-size: clamp(1.1rem, 4.5vw, 1.3rem);
      color: #4a5568;
      word-break: keep-all;
    }

    .message {
      margin: 0;
      font-size: clamp(1.3rem, 5.5vw, 1.6rem);
      word-break: keep-all;
    }

    .message.error { color: #c53030; }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 20px 16px;
      border: none;
      border-radius: 14px;
      background: #2b6cb0;
      color: #ffffff;
      font-size: clamp(1.6rem, 7vw, 1.9rem);
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { background: #90a4bf; cursor: wait; }

    .source {
      margin: 20px 0 0;
      font-size: 1rem;
      color: #718096;
    }

    .source a { color: #2b6cb0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>동의대바이브날씨의<br>부산 날씨</h1>

    <div id="result">
      <p class="message">날씨를 불러오는 중입니다...</p>
    </div>

    <button id="refreshBtn" type="button">날씨 다시 확인</button>

    <p class="source">
      날씨 정보 출처: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    </p>
  </main>

  <script>
    // 부산 좌표와 Open-Meteo 요청 주소
    const API_URL =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=35.1796&longitude=129.0756" +
      "&current=temperature_2m,weather_code" +
      "&timezone=Asia%2FSeoul";

    // WMO 날씨 코드 → 한국어 설명
    const WEATHER_TEXT = {
      0: "맑음",
      1: "대체로 맑음", 2: "구름 조금", 3: "흐림",
      45: "안개", 48: "서리 안개",
      51: "약한 이슬비", 53: "이슬비", 55: "강한 이슬비",
      56: "약한 어는 이슬비", 57: "강한 어는 이슬비",
      61: "약한 비", 63: "비", 65: "강한 비",
      66: "약한 어는 비", 67: "강한 어는 비",
      71: "약한 눈", 73: "눈", 75: "강한 눈",
      77: "싸락눈",
      80: "약한 소나기", 81: "소나기", 82: "강한 소나기",
      85: "약한 눈 소나기", 86: "강한 눈 소나기",
      95: "뇌우", 96: "우박을 동반한 뇌우", 99: "강한 우박을 동반한 뇌우"
    };

    const result = document.getElementById("result");
    const refreshBtn = document.getElementById("refreshBtn");

    // "2026-10-13T14:15" (한국 시간) → "2026년 10월 13일 오후 2시 15분 기준"
    function formatKoreanTime(isoText) {
      const [datePart, timePart] = isoText.split("T");
      const [year, month, day] = datePart.split("-").map(Number);
      const [hour, minute] = timePart.split(":").map(Number);
      const ampm = hour < 12 ? "오전" : "오후";
      const hour12 = hour % 12 === 0 ? 12 : hour % 12;
      return `${year}년 ${month}월 ${day}일 ${ampm} ${hour12}시 ${minute}분 기준 (한국 시간)`;
    }

    async function loadWeather() {
      result.innerHTML = '<p class="message">날씨를 불러오는 중입니다...</p>';
      refreshBtn.disabled = true;

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("응답 오류");

        const data = await response.json();
        const temp = data.current.temperature_2m;
        const code = data.current.weather_code;
        const desc = WEATHER_TEXT[code] ?? "알 수 없는 날씨";

        result.innerHTML = `
          <p class="temp">${temp.toFixed(1)}℃</p>
          <p class="desc">${desc}</p>
          <p class="time">${formatKoreanTime(data.current.time)}</p>
        `;
      } catch (error) {
        result.innerHTML =
          '<p class="message error">날씨를 불러오지 못했습니다.<br>잠시 후 다시 확인해 주세요.</p>';
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener("click", loadWeather);
    loadWeather();
  </script>
</body>
</html>
